# Maintainer configuration. Students do not need this file: they run
# `python verify.py` with NumPy, SciPy and Matplotlib installed.
[project]
name = "verifiedmethods-linear-systems"
version = "0.1.0.dev0"
description = "verifiedmethods unit A2: iterative methods for linear systems"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "matplotlib>=3.6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
