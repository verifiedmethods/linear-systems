name: pilot-release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published pilot version to check
        required: true
        default: "0.1.0a1"
permissions:
  contents: read
jobs:
  student-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check published assets and the bundled student workflow
        env:
          PILOT_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: uv run --python 3.12 --with pyyaml python tools/check_release.py --version "$PILOT_VERSION"
